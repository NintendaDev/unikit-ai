    depends_on: [SYS-combat]   # defect (flow Depends 3-way): FLOW.md §D adds SYS-boost; ## Flow Map shows SYS-combat only
    goals:
      - id: GOAL-first-run-1
        summary: "Land a clean chain"          # retention-critical, but emits NO event (defect: blind funnel step)
        targets: [SYS-combat]
      - id: GOAL-first-run-2
        summary: "Grab the buff from inventory"
        targets: [SYS-inventory]               # defect (dangling GOAL→SYS): SYS-inventory is in neither GD-IDS nor any doc
      - id: GOAL-first-run-3
        summary: "Reach the extraction point"  # terminal goal — realizes the GAME.md Win condition, but that Win line cites no GOAL (defect: orphan win-condition / orphan terminal goal)
        targets: [SYS-combat]
      - id: GOAL-first-run-4
        summary: "Boost off the ramp"
        targets: [SYS-boost]
      - id: GOAL-first-run-4                    # defect (duplicate GOAL id): GOAL-first-run-4 declared twice for two different objectives
        summary: "Drift the corner"
        targets: [SYS-boost]
    source: flows/FLOW-first-run.md
