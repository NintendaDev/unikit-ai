# ─── CONTENT TYPES ────────────────────────────────────────────────────────────
# The content axis (the catalog). Each CT is a schema + descriptor. Rendered
# read-only into GAME.md ## Content Map [gen]. One seeded example per content check
# (see README.md → Content-axis defects).
content_types:
  - id: CT-item
    name: "Loot item"
    status: active
    scale: bulk
    belongs_to: SYS-loot          # valid (SYS-loot is active) — NOT a belongs_to defect
    doc_status: detailed          # matches CT-item.md header → no coherence defect here
    version: 1
    research: ""
    fields:
      - { name: value, type: int, range: [1, 9999], required: true }
      - { name: rarity_tier, type: enum, values: [common, rare, epic] }
      - { name: icon, type: asset-ref }
      - { name: drop_resource, type: ref<RES> }   # schema field → RES-scrap (registered); no value to resolve for a bulk type
    source: content-types/CT-item.md
    added: 2026-06-23
    revised: ""
  - id: CT-card
    name: "Boost card"
    status: active
    scale: curated
    belongs_to: SYS-hud           # defect (#5 belongs_to): SYS-hud is status: deprecated
    doc_status: reviewed          # matches CT-card.md header → no coherence defect here
    version: 1
    research: ""
    fields:
      - { name: title, type: string, required: true }
      - { name: power, type: int, range: [1, 10] }
      - { name: link, type: ref<SYS> }            # CU-card-1.link resolves to a MISSING system (#3)
    source: content-types/CT-card.md
    added: 2026-06-23
    revised: ""
  - id: CT-spawn
    name: "Enemy spawn wave"
    status: active
    scale: bulk
    belongs_to: SYS-combat        # valid + the cross-axis edge (#9): a SYS-combat edit must stale this CT
    doc_status: reviewed
    version: 2                     # defect (#6 content version 2-place): CT-spawn.md header says Version 1
    research: ""
    fields:
      - { name: enemy, type: ref<ENT> }           # schema field → ENT-drone (registered)
      - { name: spawn_rate, type: float, range: [0.1, 5.0] }
      - { name: wave_size, type: int, range: [1, 50] }
    source: content-types/CT-spawn.md
    added: 2026-06-23
    revised: ""

