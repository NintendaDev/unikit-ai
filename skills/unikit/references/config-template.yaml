# UniKit Configuration
# This file configures unikit behavior for your project.
# All sections are optional — defaults are used when not specified.
#
# Generated by /unikit bootstrap. Safe to edit manually.
# Skills read this file at the start of every command (Step 0).

# =============================================================================
# Language Settings
# =============================================================================
# Controls the language used in AI-generated content and communication.

language:
  # Language for AI-agent communication (prompts, questions, explanations).
  # Options: en, ru, de, fr, es, zh, ja, ko, pt, it
  # Default: en
  ui: {{LANGUAGE_UI}}

  # Language for generated artifacts (plans, specs, documentation).
  # Options: en, ru, de, fr, es, zh, ja, ko, pt, it
  # Default: en (same as ui if not specified)
  artifacts: {{LANGUAGE_ARTIFACTS}}

  # Language for knowledge base rule files: everything under .unikit/memory/
  # (code/{core,stack}/, gamedesign/{core,library}/, references/,
  # RULES_INDEX.md), .unikit/RULES.md, and skill-context rules.
  #
  # Options: en, ru, de, fr, es, zh, ja, ko, pt, it
  # Default: en
  #
  # This key is INTENTIONALLY decoupled from `language.ui` and
  # `language.artifacts`. Rule files are consumed by AI agents for prompt
  # matching and instruction following; keeping them in a stable language
  # (typically English) reduces semantic drift across agents and teams.
  # Changing `language.ui` or `language.artifacts` does NOT change the
  # language of existing rule files.
  #
  # SKILLS NEVER TOUCH THIS KEY. It is manually edited only. `/unikit` and
  # `/unikit-memory` read it to decide what language to write new rule
  # prose in; they never write to it, never prompt for it, and never
  # suggest changing it. To localize rules, edit this file by hand, then
  # regenerate or manually translate existing files under .unikit/memory/.
  rules: en

  # How to handle technical terms in translations.
  # Options:
  #   - keep: preserve original English terms (API, prefab, shader, ECS, etc.)
  #   - translate: translate where common translation exists
  # Default: keep
  technical_terms: keep

# =============================================================================
# Workflow Settings
# =============================================================================
# Controls unikit workflow behavior.

workflow:
  # Maximum age (in days) for research notes to be considered "fresh"
  # by /unikit-plan when reusing existing research.
  # Research older than this is filtered OUT of the planning question, not
  # flagged; the filtering is announced by an `INFO [research] index: ...` line.
  # Default: 7
  research_relevance_days: 7

# =============================================================================
# Testing Settings
# =============================================================================
# Where test RUNS are placed in a plan (`plan`) and how wide a run goes when it
# happens (`run`). Whether the executor merges runs is asked per call by
# /unikit-implement — it is not configured here.
# These keys never affect WRITING tests: tests are written in any task of any
# phase, exactly as they are today.

testing:
  # Planner (/unikit-plan): what gets written into the plan.
  plan:
    # Where the planner places a test-run checkpoint.
    #   task   — one checkpoint per task (ultra only)
    #   phase  — one checkpoint at the end of a phase
    #   plan   — one checkpoint at the end of the plan
    # The value is a CEILING, not an obligation: a checkpoint is placed only
    # where the change is worth one. The chosen value is recorded into the
    # plan's `## Settings` as a `Test checkpoints:` line, so changing it here
    # never reinterprets an already-written plan.
    checkpoints:
      ultra: phase        # task | phase | plan
      full: phase         # phase | plan
      fast: plan          # phase | plan

  # Executor (/unikit-implement, /unikit-fix): how wide a run actually goes.
  # Read at run time and never recorded into a plan — a run may always be wider
  # than the coverage its checkpoint declares, never narrower.
  run:
    # How a phase checkpoint (`Test checkpoint: phase N` / `phases N-M`) and a
    # /unikit-fix test run choose their tests.
    #   false — run every test in the project, in one run
    #   true  — run only the test suites of the changed modules and of the
    #           modules that depend on them, in one run (every test when the
    #           narrowing is not possible)
    # `task N.M` checkpoints always run their own fixtures, and the final
    # `plan` checkpoint always runs every test, whatever this says.
    # Default: false
    use_affected_modules: false

    # With use_affected_modules: true — when the affected test suites reach
    # this share of all the project's test suites, every test is run instead.
    # Percent, an integer from 1 to 100. The default is assigned, not
    # measured: tune it on your project.
    # Default: 30
    full_run_threshold_percent: 30

# =============================================================================
# Git Settings
# =============================================================================

git:
  # Whether this project uses git-aware workflows.
  # If false:
  #   - /unikit-plan full does not create branches
  #   - /unikit-review and /unikit-verify do not assume a base branch exists
  #   - merge/push guidance is skipped
  # Default: auto-detected from the repository (.git presence)
  enabled: {{GIT_ENABLED}}

  # Default branch for diff/review/merge targets.
  # Examples: main, master, develop, trunk, 2.x
  # Default: auto-detected from git metadata, fallback main
  base_branch: {{GIT_BASE_BRANCH}}

  # Automatically create feature branches for plans.
  # Applies only when git.enabled = true.
  # If false, /unikit-plan full still creates a full plan but stays
  # on the current branch (or uses a slug-named full plan in no-git mode).
  # Default: true when git is enabled
  create_branches: true

  # Branch name prefix for new features.
  # Applies only when create_branches = true.
  # Default: feature/
  branch_prefix: feature/

  # Branch name prefix for experiment plans (/unikit-plan given experiment cards).
  # Applies only when create_branches = true. The branch is <prefix><YYYY-MM-DD>-<topic>.
  # A project without this key uses the default silently.
  # Default: experiment/
  experiment_branch_prefix: experiment/

  # Skip push prompt after /unikit-commit creates a commit.
  # If true:
  #   - /unikit-commit ends after successful local commit
  #   - no "Push to remote?" prompt is shown
  # Default: false
  skip_push_after_commit: false

  # Pull requests per plan module (/unikit-plan, /unikit-implement, /unikit-pr).
  pull_requests:
    # Write a PR checkpoint task at the end of every plan module but the last.
    # Recorded into the plan as "PR checkpoints: yes"; changing it later never
    # reinterprets a plan already written.
    # Default: false
    checkpoints: false

    # How far /unikit-pr goes — and what it does at a PR checkpoint:
    #   remind — print the PR text, the push command and the link; touch no remote
    #   create — push the module boundary, open the PR or update the open one
    #   merge  — create, then merge when the merge brings nothing from the base branch
    # Without the GitHub MCP every level acts as remind.
    # Default: create
    max_level: create   # remind | create | merge

# =============================================================================
# Subagent Settings
# =============================================================================
# Which model, and how much reasoning effort, the subagents that skills launch
# use — one value per agent in each of two blocks, model and effort. Skills read
# this block at run time, so an edit takes effect on the next command; no
# `unikit-ai update` is needed.
#
# Only the delegation aliases that name a model read it: recon-agent,
# check-agent, lens-agent and recon-writer-agent. The two that load a skill
# (develop-agent, docs-agent) never pass a model or an effort.
#
# A value is exactly what that agent's own tool accepts. UniKit keeps no list of
# names or levels: a wrong value makes the launch fail, and the skill then
# repeats the call once without the effort and, if it still fails, without the
# model.
#   <value>  — pass it to the subagent
#   inherit  — pass nothing; the subagent runs on the model — or the effort — of the session
#   (empty)  — the same as inherit; a deliberate choice, never filled in again
# A model key that is missing altogether falls back to the built-in default noted
# below; an effort key that is missing passes nothing. Each block lists the agents
# whose subagent call takes that argument without any setting of the runtime itself.
# What you ask for in a request wins over both blocks for that run: "use opus for
# the subagents" or "effort high for the subagents".

subagents:
  model:
    # Claude Code. Tier aliases: sonnet | opus | haiku.
    # Built-in default: sonnet.
    claude: sonnet

    # Codex CLI. A model identifier exactly as the model parameter of Codex's
    # spawn_agent accepts it; its schema lists the valid names. Built-in
    # default: inherit (identifiers go stale, so choose your own).
    codex: inherit

    # Antigravity. inherit | flash_lite | flash | pro — the values of the Model
    # argument of its subagent call; a tier sets the size of the model, not the
    # depth. Built-in default: flash.
    antigravity: flash

    # Cursor, OpenCode, Kimi Code, Qwen Code and Universal / Other have no key:
    # their subagent call takes no model, or takes one only after you set up the
    # client itself, so nothing is passed and the subagent runs on the model of
    # the session (the same as inherit). If you did enable it, add
    # subagents.model.<agent> by hand and the skills will read it. Take the
    # value from the client's own documentation: Kimi Code - an alias from
    # [secondary_model.models] in ~/.kimi-code/config.toml, or primary; Qwen
    # Code - a grade name from agents.modelGrades in settings.json; Universal /
    # Other - whatever the subagent tool of your agent accepts.

  effort:
    # Claude Code. low | medium | high | xhigh | max — the levels the effort
    # argument of its subagent call lists. Which levels a model supports differs,
    # and the runtime may cap a level (the setting maxEffortLevel) or override it
    # (the environment variable CLAUDE_CODE_EFFORT_LEVEL): the value written here
    # is then not the one that runs. The argument exists only in a Claude Code
    # version that has it; on an older client the call can fail and the skill
    # repeats it without the effort. Written in lower case.
    claude: medium

    # Codex CLI. The reasoning_effort argument of spawn_agent. The valid levels
    # depend on the model of the subagent, and a wrong one fails with an error
    # that lists them, so this template keeps no list. Pair it with the model
    # chosen for codex above. Written in lower case.
    codex: medium

    # Antigravity has no key: the subagent call of its client takes no effort
    # argument, and a call that adds one is rejected whole. What you can set is
    # the effort of the session itself (/effort or --effort) and, in the model
    # block above, the tier of the subagent.

    # Cursor, OpenCode, Kimi Code, Qwen Code and Universal / Other have no key
    # either: their subagent call takes no effort argument, or takes one only
    # after you set up the client itself. If you did enable it, add
    # subagents.effort.<agent> by hand and the skills will pass it.
