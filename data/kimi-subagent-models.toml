# Optional Kimi Code subagent pool: three roles × three effort variants.
#
# MANUAL MERGE ONLY. Do not replace your whole config.toml with this file and do
# not blindly duplicate tables that already exist: TOML rejects duplicate tables.
# Preserve your providers, credentials, existing [models] entries and settings.
#
# For every alias below, copy provider, model, max_context_size, capabilities and
# support_efforts in full from one existing [models] entry in your config. The
# placeholder values are deliberate and are not a runnable model definition.
# Keep every variant standalone: aliases do not inherit metadata from each other.
# default_effort belongs only under each variant's [models.<alias>.overrides].
# Assign the aliases you want to subagents.model.kimi.<role> in .unikit/config.yaml.
#
# A managed refresh or login may remove custom model entries. Check these aliases
# afterwards and restore them manually if needed. UniKit never writes global config.

[models.unikit-reader-low]
provider = "COPY_FROM_EXISTING_MODEL"
model = "COPY_FROM_EXISTING_MODEL"
max_context_size = 0
capabilities = ["COPY_FROM_EXISTING_MODEL"]
support_efforts = ["low", "high", "max"]
[models.unikit-reader-low.overrides]
default_effort = "low"

[models.unikit-reader-high]
provider = "COPY_FROM_EXISTING_MODEL"
model = "COPY_FROM_EXISTING_MODEL"
max_context_size = 0
capabilities = ["COPY_FROM_EXISTING_MODEL"]
support_efforts = ["low", "high", "max"]
[models.unikit-reader-high.overrides]
