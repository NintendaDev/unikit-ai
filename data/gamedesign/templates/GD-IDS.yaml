# Game Design Facts Registry (GD-IDS)
#
# PURPOSE: the single source of truth for every number, name, and decision that
# crosses a system boundary. Design skills check this registry before writing new
# content so cross-document drift is caught at authoring time. When a document and
# this registry disagree, the registry wins until the user resolves the conflict
# the other way through `unikit-gd-verify`.
#
# RULES:
#   - Register a fact when it appears in (or is referenced by) more than one
#     document. Internal-only facts (a formula used in one GDD) stay in that GDD.
#   - Never delete an entry — set `status: deprecated`. Dangling references are
#     verify conflicts.
#   - IDs are stable English lowercase slugs (PIL-n, SYS-slug, ENT-slug,
#     FORM-slug, AC-sys-n, DD-n). Never reuse or renumber an ID.
#   - `source` is the document that OWNS the fact.
#   - Store CURRENT VALUES ONLY. History lives in GDD changelog blocks (section K)
#     and git. On a value change: update it, set `revised` to today, and record
#     the decision under `decisions`.
#   - Writes require the same approval as document writes (see gd-principles).
#
# FORMAT: YAML. Consistent indentation is critical for grep reliability.
#   Sections: pillars | systems | entities | formulas | terms | decisions

version: 1
last_updated: ""

# ─── PILLARS ──────────────────────────────────────────────────────────────────
# The game's non-negotiable principles. Owned by GAME.md.
pillars: []
# Example:
#   - id: PIL-1
#     name: "Combat rewards patience over aggression"
#     status: active            # active | deprecated
#     source: GAME.md
#     added: 2026-06-13
#     revised: ""

# ─── SYSTEMS ──────────────────────────────────────────────────────────────────
# Every designed system. Mirrors GD-INDEX rows; owned by each system's GDD.
systems: []
# Example:
#   - id: SYS-combat
#     name: "Combat"
#     status: active            # active | deprecated
#     tier: MVP                 # MVP | VS | Alpha | Full
#     doc_status: detailed      # not-started | skeleton | detailed | reviewed | revised
#     version: 1
#     implements: [PIL-1]
#     depends_on: [SYS-stamina]
#     source: systems/SYS-combat.md
#     added: 2026-06-13
#     revised: ""

# ─── ENTITIES ─────────────────────────────────────────────────────────────────
# Named game-world objects with cross-doc stats: enemies, NPCs, items, factions.
entities: []
# Example:
#   - id: ENT-goblin
#     name: "Goblin"
#     status: active
#     source: systems/SYS-combat.md
#     attributes:
#       health: 40
#       damage: 8
#     added: 2026-06-13
#     revised: ""

# ─── FORMULAS ─────────────────────────────────────────────────────────────────
# Named calculations whose output feeds another system, or that another doc cites.
formulas: []
# Example:
#   - id: FORM-damage
#     name: "Damage"
#     status: active
#     source: systems/SYS-combat.md
#     variables: [attack, defense, crit_chance, crit_multiplier]
#     output_range: [0, 999]
#     expression: "max(0, attack - defense) * (1 + crit_chance * crit_multiplier)"
#     added: 2026-06-13
#     revised: ""

# ─── TERMS ────────────────────────────────────────────────────────────────────
# Canonical vocabulary. The canonical name is always English; record the
# translation and any forbidden aliases so reviews can catch terminology drift.
terms: []
# Example:
#   - id: stagger
#     canonical: "Stagger"
#     translation: "Оглушение"
#     forbidden_aliases: ["stun", "daze"]
#     status: active
#     source: systems/SYS-combat.md
#     added: 2026-06-13

# ─── DECISIONS ────────────────────────────────────────────────────────────────
# Design-decision log (Nygard). One record per significant decision: the options
# considered, the rationale, and the systems it affects. Referenced from changelog
# blocks as (DD-n).
decisions: []
# Example:
#   - id: DD-1
#     summary: "Stamina gates dodge instead of cooldown"
#     options: ["cooldown timer", "stamina cost"]
#     decision: "stamina cost"
#     rationale: "Serves PIL-1 (patience over aggression) — resource pressure, not a clock."
#     affects: [SYS-combat, SYS-stamina]
#     date: 2026-06-13
